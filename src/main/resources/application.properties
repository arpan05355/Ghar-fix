spring.application.name=gharfix
server.port=${PORT:5000}

# Local Database (H2 file-based persistence for instant zero-configuration local runs)
spring.datasource.url=jdbc:h2:file:./instance/gharfix_h2;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.gharfix=INFO

# JWT Configuration (for mobile REST API)
jwt.secret=dGhpc0lzQVNlY3VyZVNlY3JldEtleUZvckdoYXJGaXhKV1RBdXRoMTIzNDU2Nzg5MDEyMzQ1
jwt.expiration-ms=86400000

# Razorpay Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TYlYzkePVAzKNN}
