<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GharFix Footer</title>
</head>
<body>
<footer th:fragment="siteFooter" class="gf-site-footer">
    <div class="gf-footer-container">
        <div class="gf-footer-main">
            <!-- Brand & Tagline -->
            <div class="gf-footer-brand">
                <a href="/" class="gf-footer-logo">
                    <i class="fa-solid fa-house-chimney"></i>
                    <span>Ghar<em>Fix</em></span>
                </a>
                <p class="gf-footer-tagline">Reliable, verified home services at your doorstep in Vadodara.</p>
            </div>

            <!-- Links Columns -->
            <div class="gf-footer-columns">
                <!-- Company Column -->
                <div class="gf-footer-col">
                    <h4 class="gf-footer-col-title">Company</h4>
                    <ul class="gf-footer-links">
                        <li><a href="#">About</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>

                <!-- Legal Column -->
                <div class="gf-footer-col">
                    <h4 class="gf-footer-col-title">Legal</h4>
                    <ul class="gf-footer-links">
                        <li><a href="/terms-of-service">Terms of Service</a></li>
                        <li><a href="/privacy-policy">Privacy Policy</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Bottom Copyright -->
        <div class="gf-footer-bottom">
            <p>© 2026 GharFix</p>
        </div>
    </div>

    <style>
        .gf-site-footer {
            background-color: #1A1A1A;
            color: #FFFFFF;
            width: 100%;
            padding: 56px 24px 28px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin-top: auto;
            border-top: 1px solid #2A2A2A;
            box-sizing: border-box;
        }

        .gf-footer-container {
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
        }

        .gf-footer-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 40px;
            padding-bottom: 40px;
        }

        .gf-footer-brand {
            max-width: 380px;
        }

        .gf-footer-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .gf-footer-logo i {
            color: #FFFFFF;
            font-size: 20px;
        }

        .gf-footer-logo em {
            font-style: normal;
            color: #4B5563;
        }

        .gf-footer-tagline {
            font-size: 14px;
            color: #9CA3AF;
            line-height: 1.6;
            margin: 0;
        }

        .gf-footer-columns {
            display: flex;
            gap: 64px;
            flex-wrap: wrap;
        }

        .gf-footer-col-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #F3F4F6;
            margin: 0 0 16px 0;
        }

        .gf-footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gf-footer-links a {
            font-size: 14px;
            color: #9CA3AF;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .gf-footer-links a:hover {
            color: #FFFFFF;
        }

        .gf-footer-bottom {
            border-top: 1px solid #2E2E2E;
            padding-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #6B7280;
        }

        .gf-footer-bottom p {
            margin: 0;
        }

        @media (max-width: 768px) {
            .gf-site-footer {
                padding: 44px 20px 24px;
            }

            .gf-footer-main {
                flex-direction: column;
                gap: 32px;
                padding-bottom: 32px;
            }

            .gf-footer-columns {
                gap: 48px;
            }
        }
    </style>
</footer>
</body>
</html>
