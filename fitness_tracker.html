<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormIQ AI - Fitness System</title>
  <!-- Load React, ReactDOM, and Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const EXERCISES = [
      {
        id: "squat",
        name: "Squat",
        icon: "🏋️",
        muscle: "Quads, Glutes",
        cues: ["Feet shoulder-width apart", "Knees over toes", "Back straight", "Lower to 90°"],
        reps: 12,
        sets: 3,
        difficulty: "Beginner",
      },
      {
        id: "pushup",
        name: "Push-Up",
        icon: "💪",
        muscle: "Chest, Triceps",
        cues: ["Hands wider than shoulders", "Core tight", "Elbows at 45°", "Full range of motion"],
        reps: 10,
        sets: 3,
        difficulty: "Beginner",
      },
      {
        id: "deadlift",
        name: "Deadlift",
        icon: "⚡",
        muscle: "Hamstrings, Back",
        cues: ["Hinge at hips", "Bar close to body", "Neutral spine", "Drive through heels"],
        reps: 8,
        sets: 4,
        difficulty: "Intermediate",
      },
      {
        id: "plank",
        name: "Plank",
        icon: "🔥",
        muscle: "Core, Shoulders",
        cues: ["Shoulders over wrists", "Hips neutral", "Engage core", "Breathe steadily"],
        reps: 60,
        sets: 3,
        difficulty: "Beginner",
        isTime: true,
      },
      {
        id: "lunge",
        name: "Lunge",
        icon: "🦵",
        muscle: "Quads, Glutes",
        cues: ["Step forward wide", "Front knee over ankle", "Back knee near floor", "Torso upright"],
        reps: 10,
        sets: 3,
        difficulty: "Beginner",
      },
      {
        id: "burpee",
        name: "Burpee",
        icon: "🌊",
        muscle: "Full Body",
        cues: ["Explosive jump", "Land soft", "Plank position", "Chest to floor"],
        reps: 8,
        sets: 3,
        difficulty: "Advanced",
      },
    ];

    const AI_FEEDBACK = [
      "Great form! Keep your core engaged throughout the movement.",
      "Watch your knee alignment — push them slightly outward.",
      "Excellent depth on that rep! Your posterior chain is activating well.",
      "Try slowing down the eccentric phase for more muscle activation.",
      "Your posture analysis shows 94% alignment — outstanding!",
      "Breathe out on exertion, breathe in on the return phase.",
      "Center of gravity looks optimal. Maintain this throughout the set.",
      "Slight forward lean detected — engage your lats to stabilize.",
    ];

    const POSTURE_SCORES = [88, 91, 85, 94, 89, 97, 82, 95];

    function PostureRadar({ score }) {
      const metrics = [
        { label: "Spine", value: score - 2 },
        { label: "Hips", value: score + 1 },
        { label: "Knees", value: score - 5 },
        { label: "Shoulders", value: score + 3 },
        { label: "Core", value: score - 1 },
        { label: "Balance", value: score - 3 },
      ];
      const cx = 90, cy = 90, r = 65;
      const points = metrics.map((m, i) => {
        const angle = (i / metrics.length) * 2 * Math.PI - Math.PI / 2;
        const len = (Math.min(m.value, 100) / 100) * r;
        return { x: cx + len * Math.cos(angle), y: cy + len * Math.sin(angle), label: m.label, value: m.value, lx: cx + (r + 18) * Math.cos(angle), ly: cy + (r + 18) * Math.sin(angle) };
      });
      const polygon = points.map(p => `${p.x},${p.y}`).join(" ");
      const gridLevels = [0.25, 0.5, 0.75, 1];

      return (
        <svg viewBox="0 0 180 180" style={{ width: "100%", maxWidth: 200 }}>
          {gridLevels.map(level =>
            <polygon key={level} points={metrics.map((_, i) => {
              const angle = (i / metrics.length) * 2 * Math.PI - Math.PI / 2;
              const len = level * r;
              return `${cx + len * Math.cos(angle)},${cy + len * Math.sin(angle)}`;
            }).join(" ")} fill="none" stroke="#1e3a5f" strokeWidth="0.8" />
          )}
          {metrics.map((_, i) => {
            const angle = (i / metrics.length) * 2 * Math.PI - Math.PI / 2;
            return <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(angle)} y2={cy + r * Math.sin(angle)} stroke="#1e3a5f" strokeWidth="0.8" />;
          })}
          <polygon points={polygon} fill="rgba(0,240,180,0.15)" stroke="#00f0b4" strokeWidth="1.5" />
          {points.map((p, i) => (
            <g key={i}>
              <circle cx={p.x} cy={p.y} r={2.5} fill="#00f0b4" />
              <text x={p.lx} y={p.ly} textAnchor="middle" dominantBaseline="middle" fill="#7eb8d4" fontSize="8" fontFamily="monospace">{p.label}</text>
            </g>
          ))}
        </svg>
      );
    }

    function BodySkeleton({ isActive, postureScore }) {
      const goodPosture = postureScore > 90;
      const color = goodPosture ? "#00f0b4" : postureScore > 75 ? "#ffd166" : "#ef4565";
      const pulse = isActive ? "skeleton-pulse" : "";

      return (
        <svg viewBox="0 0 120 220" style={{ width: "100%", maxWidth: 140 }} className={pulse}>
          {/* Head */}
          <circle cx="60" cy="22" r="14" fill="none" stroke={color} strokeWidth="2.5" opacity="0.9" />
          {/* Neck */}
          <line x1="60" y1="36" x2="60" y2="50" stroke={color} strokeWidth="2.5" />
          {/* Shoulders */}
          <line x1="25" y1="58" x2="95" y2="58" stroke={color} strokeWidth="2.5" />
          {/* Spine */}
          <line x1="60" y1="50" x2="60" y2="130" stroke={color} strokeWidth="2.5" />
          {/* Left arm */}
          <line x1="25" y1="58" x2="10" y2="95" stroke={color} strokeWidth="2" />
          <line x1="10" y1="95" x2="5" y2="125" stroke={color} strokeWidth="2" />
          {/* Right arm */}
          <line x1="95" y1="58" x2="110" y2="95" stroke={color} strokeWidth="2" />
          <line x1="110" y1="95" x2="115" y2="125" stroke={color} strokeWidth="2" />
          {/* Hips */}
          <line x1="38" y1="130" x2="82" y2="130" stroke={color} strokeWidth="2.5" />
          {/* Left leg */}
          <line x1="45" y1="130" x2="38" y2="178" stroke={color} strokeWidth="2.5" />
          <line x1="38" y1="178" x2="35" y2="210" stroke={color} strokeWidth="2" />
          {/* Right leg */}
          <line x1="75" y1="130" x2="82" y2="178" stroke={color} strokeWidth="2.5" />
          <line x1="82" y1="178" x2="85" y2="210" stroke={color} strokeWidth="2" />
          {/* Joint dots */}
          {[[60,22],[60,50],[25,58],[95,58],[10,95],[110,95],[38,130],[82,130],[38,178],[82,178]].map(([x,y],i) =>
            <circle key={i} cx={x} cy={y} r="3" fill={color} opacity="0.8" />
          )}
          {isActive && <circle cx="60" cy="22" r="18" fill="none" stroke={color} strokeWidth="1" opacity="0.3">
            <animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite" />
          </circle>}
        </svg>
      );
    }

    function FitnessTracker() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [selectedExercise, setSelectedExercise] = useState(EXERCISES[0]);
      const [isTracking, setIsTracking] = useState(false);
      const [currentRep, setCurrentRep] = useState(0);
      const [currentSet, setCurrentSet] = useState(1);
      const [postureScore, setPostureScore] = useState(91);
      const [feedback, setFeedback] = useState("");
      const [feedbackVisible, setFeedbackVisible] = useState(false);
      const [loading, setLoading] = useState(false);
      const [aiChat, setAiChat] = useState([]);
      const [chatInput, setChatInput] = useState("");
      const [workoutLog, setWorkoutLog] = useState([
        { date: "Mon", calories: 320, duration: 42, score: 88 },
        { date: "Tue", calories: 280, duration: 35, score: 91 },
        { date: "Wed", calories: 410, duration: 55, score: 85 },
        { date: "Thu", calories: 360, duration: 48, score: 94 },
        { date: "Fri", calories: 290, duration: 38, score: 89 },
        { date: "Sat", calories: 450, duration: 60, score: 97 },
        { date: "Sun", calories: 0, duration: 0, score: 0 },
      ]);
      const [streak, setStreak] = useState(6);
      const intervalRef = useRef(null);
      const feedbackIdx = useRef(0);
      const chatEndRef = useRef(null);

      useEffect(() => {
        if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
      }, [aiChat]);

      const startTracking = () => {
        setIsTracking(true);
        setCurrentRep(0);
        setCurrentSet(1);
        triggerFeedback();
        intervalRef.current = setInterval(() => {
          setCurrentRep(r => {
            const next = r + 1;
            const maxReps = selectedExercise.reps;
            if (next > maxReps) {
              setCurrentSet(s => {
                if (s >= selectedExercise.sets) {
                  stopTracking();
                  return s;
                }
                return s + 1;
              });
              triggerFeedback();
              return 0;
            }
            setPostureScore(POSTURE_SCORES[Math.floor(Math.random() * POSTURE_SCORES.length)]);
            if (next % 3 === 0) triggerFeedback();
            return next;
          });
        }, 1200);
      };

      const stopTracking = () => {
        setIsTracking(false);
        clearInterval(intervalRef.current);
      };

      const triggerFeedback = () => {
        const msg = AI_FEEDBACK[feedbackIdx.current % AI_FEEDBACK.length];
        feedbackIdx.current++;
        setFeedback(msg);
        setFeedbackVisible(true);
        setTimeout(() => setFeedbackVisible(false), 3500);
      };

      const sendChat = async () => {
        if (!chatInput.trim()) return;
        const userMsg = chatInput.trim();
        setChatInput("");
        setAiChat(prev => [...prev, { role: "user", text: userMsg }]);
        setLoading(true);

        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 1000,
              system: `You are an elite AI fitness coach and posture analyst. You specialize in real-time exercise guidance, injury prevention, and performance optimization. You have analyzed the user's current workout:
  - Exercise: ${selectedExercise.name}
  - Current set: ${currentSet}/${selectedExercise.sets}
  - Reps completed: ${currentRep}/${selectedExercise.reps}
  - Posture score: ${postureScore}/100
  - Target muscles: ${selectedExercise.muscle}
  Keep responses concise (2-3 sentences), motivating, and technically precise. Use emojis sparingly.`,
              messages: [
                ...aiChat.map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text })),
                { role: "user", content: userMsg }
              ],
            }),
          });
          const data = await response.json();
          const reply = data.content?.map(b => b.text || "").join("") || "Keep pushing — you've got this!";
          setAiChat(prev => [...prev, { role: "assistant", text: reply }]);
        } catch {
          setAiChat(prev => [...prev, { role: "assistant", text: "Keep pushing — form is everything. Stay focused on the cues!" }]);
        }
        setLoading(false);
      };

      const maxCal = Math.max(...workoutLog.map(d => d.calories));

      return (
        <div style={{
          minHeight: "100vh",
          background: "#020d18",
          fontFamily: "'Courier New', monospace",
          color: "#c8e6f5",
          display: "flex",
          flexDirection: "column",
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
            * { box-sizing: border-box; margin: 0; padding: 0; }
            ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #020d18; } ::-webkit-scrollbar-thumb { background: #00f0b4; border-radius: 2px; }
            .orbitron { font-family: 'Orbitron', monospace; }
            .scanline { position: relative; overflow: hidden; }
            .scanline::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,240,180,0.02) 2px, rgba(0,240,180,0.02) 4px); pointer-events: none; }
            .tab-btn { background: none; border: none; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 11px; padding: 10px 16px; color: #4a8aa8; letter-spacing: 1px; transition: all 0.2s; border-bottom: 2px solid transparent; }
            .tab-btn.active { color: #00f0b4; border-bottom: 2px solid #00f0b4; }
            .tab-btn:hover { color: #7eb8d4; }
            .card { background: #071828; border: 1px solid #0d2d48; border-radius: 4px; padding: 18px; }
            .card-accent { border-left: 3px solid #00f0b4; }
            .btn-primary { background: #00f0b4; color: #020d18; border: none; cursor: pointer; font-family: 'Orbitron', monospace; font-weight: 700; font-size: 12px; padding: 12px 28px; letter-spacing: 2px; border-radius: 2px; transition: all 0.2s; }
            .btn-primary:hover { background: #00d4a0; transform: translateY(-1px); }
            .btn-secondary { background: transparent; color: #ef4565; border: 1px solid #ef4565; cursor: pointer; font-family: 'Orbitron', monospace; font-size: 11px; padding: 10px 22px; letter-spacing: 2px; border-radius: 2px; transition: all 0.2s; }
            .btn-secondary:hover { background: rgba(239,69,101,0.1); }
            .exercise-card { background: #071828; border: 1px solid #0d2d48; border-radius: 4px; padding: 14px; cursor: pointer; transition: all 0.2s; }
            .exercise-card:hover, .exercise-card.selected { border-color: #00f0b4; background: #0a2035; }
            .score-ring { position: relative; display: inline-block; }
            .feedback-toast { position: fixed; bottom: 24px; right: 24px; background: #071828; border: 1px solid #00f0b4; border-radius: 4px; padding: 14px 18px; max-width: 320px; z-index: 100; transform: translateX(400px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 30px rgba(0,240,180,0.2); }
            .feedback-toast.visible { transform: translateX(0); }
            .chat-bubble { padding: 10px 14px; border-radius: 4px; font-size: 13px; line-height: 1.6; max-width: 85%; }
            .chat-bubble.user { background: #0d2d48; border: 1px solid #1e4a6e; align-self: flex-end; }
            .chat-bubble.assistant { background: #071828; border: 1px solid #00f0b4; border-left: 3px solid #00f0b4; align-self: flex-start; }
            .chat-input { background: #071828; border: 1px solid #0d2d48; color: #c8e6f5; padding: 12px 16px; font-family: 'Share Tech Mono', monospace; font-size: 13px; border-radius: 4px; outline: none; flex: 1; transition: border 0.2s; }
            .chat-input:focus { border-color: #00f0b4; }
            .metric-bar { height: 4px; background: #0d2d48; border-radius: 2px; overflow: hidden; margin-top: 6px; }
            .metric-fill { height: 100%; background: linear-gradient(90deg, #00f0b4, #0090ff); border-radius: 2px; transition: width 0.8s ease; }
            .skeleton-pulse circle, .skeleton-pulse line { animation: skPulse 1.5s ease-in-out infinite; }
            @keyframes skPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
            .glow { text-shadow: 0 0 20px rgba(0,240,180,0.5); }
            .badge { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 10px; letter-spacing: 1px; }
            .badge-beginner { background: rgba(0,240,180,0.15); color: #00f0b4; border: 1px solid rgba(0,240,180,0.3); }
            .badge-intermediate { background: rgba(255,209,102,0.15); color: #ffd166; border: 1px solid rgba(255,209,102,0.3); }
            .badge-advanced { background: rgba(239,69,101,0.15); color: #ef4565; border: 1px solid rgba(239,69,101,0.3); }
            .progress-circle { transform: rotate(-90deg); transform-origin: center; }
          `}</style>

          {/* Header */}
          <header style={{ borderBottom: "1px solid #0d2d48", padding: "0 24px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 56 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 28, height: 28, background: "#00f0b4", borderRadius: 2, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <span style={{ fontSize: 14 }}>⚡</span>
              </div>
              <span className="orbitron glow" style={{ fontSize: 15, fontWeight: 900, letterSpacing: 3, color: "#00f0b4" }}>FORMIQ AI</span>
              <span style={{ fontSize: 10, color: "#4a8aa8", letterSpacing: 2, marginTop: 2 }}>FITNESS SYSTEM</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: "#4a8aa8", letterSpacing: 1 }}>STREAK</div>
                <div className="orbitron" style={{ fontSize: 14, color: "#ffd166", fontWeight: 700 }}>🔥 {streak} DAYS</div>
              </div>
              <div style={{ width: 32, height: 32, borderRadius: "50%", background: "linear-gradient(135deg,#0d2d48,#1e4a6e)", border: "2px solid #00f0b4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>👤</div>
            </div>
          </header>

          {/* Tab Nav */}
          <nav style={{ borderBottom: "1px solid #0d2d48", padding: "0 24px", display: "flex" }}>
            {[
              { id: "dashboard", label: "DASHBOARD" },
              { id: "workout", label: "WORKOUT" },
              { id: "posture", label: "POSTURE AI" },
              { id: "coach", label: "AI COACH" },
            ].map(t => (
              <button key={t.id} className={`tab-btn ${activeTab === t.id ? "active" : ""}`} onClick={() => setActiveTab(t.id)}>{t.label}</button>
            ))}
          </nav>

          {/* Main Content */}
          <main style={{ flex: 1, padding: "24px", maxWidth: 1100, margin: "0 auto", width: "100%" }}>

            {/* DASHBOARD */}
            {activeTab === "dashboard" && (
              <div style={{ display: "grid", gap: 20 }}>
                {/* Top row stats */}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
                  {[
                    { label: "AVG POSTURE", value: "91%", sub: "+3% this week", color: "#00f0b4" },
                    { label: "CALORIES", value: "2,110", sub: "this week", color: "#ffd166" },
                    { label: "WORKOUTS", value: "6", sub: "this week", color: "#0090ff" },
                    { label: "FORM SCORE", value: "94", sub: "personal best", color: "#ef4565" },
                  ].map((s, i) => (
                    <div key={i} className="card" style={{ borderLeft: `3px solid ${s.color}` }}>
                      <div style={{ fontSize: 10, color: "#4a8aa8", letterSpacing: 1, marginBottom: 8 }}>{s.label}</div>
                      <div className="orbitron" style={{ fontSize: 26, fontWeight: 900, color: s.color }}>{s.value}</div>
                      <div style={{ fontSize: 11, color: "#4a8aa8", marginTop: 4 }}>{s.sub}</div>
                    </div>
                  ))}
                </div>

                <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 20 }}>
                  {/* Weekly Chart */}
                  <div className="card">
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20 }}>
                      <span className="orbitron" style={{ fontSize: 12, letterSpacing: 2, color: "#7eb8d4" }}>WEEKLY ACTIVITY</span>
                      <span style={{ fontSize: 10, color: "#4a8aa8" }}>CALORIES BURNED</span>
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 120 }}>
                      {workoutLog.map((d, i) => (
                        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                          <div style={{ width: "100%", display: "flex", alignItems: "flex-end", height: 90, justifyContent: "center" }}>
                            <div style={{
                              width: "80%",
                              height: d.calories ? `${(d.calories / maxCal) * 90}px` : "4px",
                              background: d.calories ? "linear-gradient(180deg,#00f0b4,#0090ff)" : "#0d2d48",
                              borderRadius: "2px 2px 0 0",
                              transition: "height 0.8s ease",
                              position: "relative",
                              overflow: "hidden",
                            }}>
                              {d.calories > 0 && <div style={{ position: "absolute", inset: 0, background: "repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,0.05) 3px,rgba(255,255,255,0.05) 6px)" }} />}
                            </div>
                          </div>
                          <div style={{ fontSize: 9, color: d.date === "Sat" ? "#00f0b4" : "#4a8aa8", letterSpacing: 1 }}>{d.date}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Posture Score Ring */}
                  <div className="card" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
                    <span className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4" }}>TODAY'S POSTURE</span>
                    <div style={{ position: "relative", width: 120, height: 120 }}>
                      <svg viewBox="0 0 120 120" style={{ width: "100%", transform: "rotate(-90deg)" }}>
                        <circle cx="60" cy="60" r="50" fill="none" stroke="#0d2d48" strokeWidth="8" />
                        <circle cx="60" cy="60" r="50" fill="none" stroke="#00f0b4" strokeWidth="8"
                          strokeDasharray={`${2 * Math.PI * 50 * postureScore / 100} ${2 * Math.PI * 50}`}
                          strokeLinecap="round" style={{ transition: "stroke-dasharray 1s ease" }} />
                      </svg>
                      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                        <div className="orbitron glow" style={{ fontSize: 28, fontWeight: 900, color: "#00f0b4" }}>{postureScore}</div>
                        <div style={{ fontSize: 9, color: "#4a8aa8", letterSpacing: 1 }}>/ 100</div>
                      </div>
                    </div>
                    <div style={{ width: "100%", display: "flex", flexDirection: "column", gap: 8 }}>
                      {[["Spine", 94], ["Hips", 89], ["Knees", 87]].map(([l, v]) => (
                        <div key={l}>
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, marginBottom: 4 }}>
                            <span style={{ color: "#7eb8d4" }}>{l}</span>
                            <span style={{ color: "#00f0b4" }}>{v}%</span>
                          </div>
                          <div className="metric-bar"><div className="metric-fill" style={{ width: `${v}%` }} /></div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Recent Exercises */}
                <div className="card">
                  <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 16 }}>QUICK START</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
                    {EXERCISES.slice(0, 3).map(ex => (
                      <div key={ex.id} className="exercise-card" onClick={() => { setSelectedExercise(ex); setActiveTab("workout"); }}>
                        <div style={{ fontSize: 24, marginBottom: 8 }}>{ex.icon}</div>
                        <div className="orbitron" style={{ fontSize: 12, color: "#c8e6f5", marginBottom: 4 }}>{ex.name}</div>
                        <div style={{ fontSize: 10, color: "#4a8aa8", marginBottom: 8 }}>{ex.muscle}</div>
                        <span className={`badge badge-${ex.difficulty.toLowerCase()}`}>{ex.difficulty}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* WORKOUT TAB */}
            {activeTab === "workout" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1.5fr", gap: 20 }}>
                {/* Exercise List */}
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 4 }}>SELECT EXERCISE</div>
                  {EXERCISES.map(ex => (
                    <div key={ex.id} className={`exercise-card ${selectedExercise.id === ex.id ? "selected" : ""}`} onClick={() => { setSelectedExercise(ex); stopTracking(); setCurrentRep(0); setCurrentSet(1); }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <span style={{ fontSize: 22 }}>{ex.icon}</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <span className="orbitron" style={{ fontSize: 12, color: selectedExercise.id === ex.id ? "#00f0b4" : "#c8e6f5" }}>{ex.name}</span>
                            <span className={`badge badge-${ex.difficulty.toLowerCase()}`}>{ex.difficulty}</span>
                          </div>
                          <div style={{ fontSize: 10, color: "#4a8aa8", marginTop: 3 }}>{ex.muscle} • {ex.sets}×{ex.reps}{ex.isTime ? "s" : ""}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Workout Panel */}
                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  <div className="card card-accent">
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
                      <div>
                        <div style={{ fontSize: 28, marginBottom: 6 }}>{selectedExercise.icon}</div>
                        <div className="orbitron" style={{ fontSize: 20, fontWeight: 900, color: "#c8e6f5" }}>{selectedExercise.name}</div>
                        <div style={{ fontSize: 11, color: "#4a8aa8", marginTop: 4 }}>{selectedExercise.muscle}</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 10, color: "#4a8aa8", letterSpacing: 1 }}>SET</div>
                        <div className="orbitron" style={{ fontSize: 32, fontWeight: 900, color: "#00f0b4" }}>{currentSet}<span style={{ fontSize: 14, color: "#4a8aa8" }}>/{selectedExercise.sets}</span></div>
                      </div>
                    </div>

                    {/* Rep Counter */}
                    <div style={{ display: "flex", justifyContent: "center", alignItems: "center", margin: "20px 0" }}>
                      <div style={{ position: "relative", width: 160, height: 160 }}>
                        <svg viewBox="0 0 160 160" style={{ width: "100%", transform: "rotate(-90deg)" }}>
                          <circle cx="80" cy="80" r="70" fill="none" stroke="#0d2d48" strokeWidth="10" />
                          <circle cx="80" cy="80" r="70" fill="none" stroke={isTracking ? "#00f0b4" : "#1e4a6e"} strokeWidth="10"
                            strokeDasharray={`${2 * Math.PI * 70 * (currentRep / selectedExercise.reps)} ${2 * Math.PI * 70}`}
                            strokeLinecap="round" style={{ transition: "stroke-dasharray 0.5s ease" }} />
                        </svg>
                        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                          <div className="orbitron" style={{ fontSize: 48, fontWeight: 900, color: isTracking ? "#00f0b4" : "#7eb8d4", lineHeight: 1 }}>{currentRep}</div>
                          <div style={{ fontSize: 11, color: "#4a8aa8", letterSpacing: 1 }}>/ {selectedExercise.reps} {selectedExercise.isTime ? "SEC" : "REPS"}</div>
                        </div>
                      </div>
                    </div>

                    <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                      {!isTracking ? (
                        <button className="btn-primary" onClick={startTracking}>▶ START TRACKING</button>
                      ) : (
                        <button className="btn-secondary" onClick={stopTracking}>■ STOP</button>
                      )}
                    </div>
                  </div>

                  {/* Form Cues */}
                  <div className="card">
                    <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 14 }}>FORM CUES</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      {selectedExercise.cues.map((cue, i) => (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", background: "#020d18", borderRadius: 2, borderLeft: "2px solid #00f0b4" }}>
                          <span className="orbitron" style={{ fontSize: 10, color: "#00f0b4", minWidth: 20 }}>0{i + 1}</span>
                          <span style={{ fontSize: 12, color: "#c8e6f5" }}>{cue}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Live Posture */}
                  {isTracking && (
                    <div className="card" style={{ border: "1px solid #00f0b4" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                        <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#00f0b4" }}>◉ LIVE POSTURE SCORE</div>
                        <div className="orbitron" style={{ fontSize: 22, fontWeight: 900, color: "#00f0b4" }}>{postureScore}<span style={{ fontSize: 11 }}>/100</span></div>
                      </div>
                      <div className="metric-bar" style={{ height: 6 }}>
                        <div className="metric-fill" style={{ width: `${postureScore}%`, background: postureScore > 90 ? "linear-gradient(90deg,#00f0b4,#00d4a0)" : postureScore > 75 ? "linear-gradient(90deg,#ffd166,#f4a261)" : "linear-gradient(90deg,#ef4565,#c1121f)" }} />
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* POSTURE AI TAB */}
            {activeTab === "posture" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 20 }}>
                {/* Skeleton View */}
                <div className="card scanline" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20 }}>
                  <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4" }}>BODY MODEL</div>
                  <BodySkeleton isActive={isTracking} postureScore={postureScore} />
                  <div style={{ textAlign: "center" }}>
                    <div className="orbitron" style={{ fontSize: 28, fontWeight: 900, color: postureScore > 90 ? "#00f0b4" : postureScore > 75 ? "#ffd166" : "#ef4565" }}>{postureScore}%</div>
                    <div style={{ fontSize: 11, color: "#4a8aa8", letterSpacing: 1 }}>POSTURE SCORE</div>
                  </div>
                  <div style={{ display: "flex", gap: 10, width: "100%" }}>
                    <button className="btn-primary" style={{ flex: 1, padding: "10px" }} onClick={() => { setIsTracking(t => !t); setPostureScore(POSTURE_SCORES[Math.floor(Math.random() * POSTURE_SCORES.length)]); }}>
                      {isTracking ? "■ STOP" : "▶ ANALYZE"}
                    </button>
                  </div>
                </div>

                {/* Radar Chart */}
                <div className="card" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20 }}>
                  <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4" }}>JOINT ANALYSIS</div>
                  <PostureRadar score={postureScore} />
                  <div style={{ width: "100%", display: "flex", flexDirection: "column", gap: 8 }}>
                    {[["Spine Alignment", postureScore - 2], ["Hip Symmetry", postureScore + 1], ["Knee Tracking", postureScore - 5], ["Shoulder Level", postureScore + 3]].map(([l, v]) => (
                      <div key={l}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, marginBottom: 3 }}>
                          <span style={{ color: "#7eb8d4" }}>{l}</span>
                          <span style={{ color: Math.min(v, 100) > 90 ? "#00f0b4" : "#ffd166" }}>{Math.min(v, 100)}%</span>
                        </div>
                        <div className="metric-bar"><div className="metric-fill" style={{ width: `${Math.min(v, 100)}%` }} /></div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Feedback Panel */}
                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  <div className="card card-accent">
                    <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 16 }}>AI DIAGNOSIS</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {[
                        { label: "POSTURE GRADE", value: postureScore > 90 ? "EXCELLENT" : postureScore > 75 ? "GOOD" : "NEEDS WORK", color: postureScore > 90 ? "#00f0b4" : postureScore > 75 ? "#ffd166" : "#ef4565" },
                        { label: "INJURY RISK", value: postureScore > 90 ? "LOW" : postureScore > 75 ? "MODERATE" : "HIGH", color: postureScore > 90 ? "#00f0b4" : postureScore > 75 ? "#ffd166" : "#ef4565" },
                        { label: "EFFICIENCY", value: `${Math.round(postureScore * 0.95)}%`, color: "#0090ff" },
                      ].map(item => (
                        <div key={item.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", background: "#020d18", borderRadius: 2 }}>
                          <span style={{ fontSize: 10, color: "#4a8aa8", letterSpacing: 1 }}>{item.label}</span>
                          <span className="orbitron" style={{ fontSize: 13, fontWeight: 700, color: item.color }}>{item.value}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="card">
                    <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 14 }}>CORRECTIONS</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      {["Slight anterior pelvic tilt detected — engage core.", "Left shoulder 2° lower than right — level out.", "Knees tracking inward — push outward on descent."].map((c, i) => (
                        <div key={i} style={{ padding: "10px 12px", background: "#020d18", borderRadius: 2, fontSize: 12, color: "#c8e6f5", lineHeight: 1.5, borderLeft: "2px solid #ffd166" }}>
                          {c}
                        </div>
                      ))}
                    </div>
                  </div>

                  <button className="btn-primary" onClick={() => setPostureScore(POSTURE_SCORES[Math.floor(Math.random() * POSTURE_SCORES.length)])}>
                    ↻ REFRESH ANALYSIS
                  </button>
                </div>
              </div>
            )}

            {/* AI COACH TAB */}
            {activeTab === "coach" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 20, height: "calc(100vh - 200px)" }}>
                {/* Context Panel */}
                <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                  <div className="card card-accent">
                    <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 14 }}>CURRENT SESSION</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      {[
                        ["EXERCISE", selectedExercise.name],
                        ["SET", `${currentSet} / ${selectedExercise.sets}`],
                        ["REPS", `${currentRep} / ${selectedExercise.reps}`],
                        ["POSTURE", `${postureScore} / 100`],
                        ["MUSCLE", selectedExercise.muscle],
                      ].map(([l, v]) => (
                        <div key={l} style={{ display: "flex", justifyContent: "space-between" }}>
                          <span style={{ fontSize: 10, color: "#4a8aa8", letterSpacing: 1 }}>{l}</span>
                          <span className="orbitron" style={{ fontSize: 11, color: "#c8e6f5" }}>{v}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="card">
                    <div className="orbitron" style={{ fontSize: 11, letterSpacing: 2, color: "#7eb8d4", marginBottom: 12 }}>QUICK ASK</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {["How's my form?", "How many calories am I burning?", "What should I focus on?", "Suggest a modification"].map(q => (
                        <button key={q} onClick={() => setChatInput(q)} style={{ background: "#020d18", border: "1px solid #0d2d48", color: "#7eb8d4", padding: "8px 12px", fontSize: 11, cursor: "pointer", borderRadius: 2, textAlign: "left", transition: "all 0.2s" }}
                          onMouseEnter={e => e.target.style.borderColor = "#00f0b4"}
                          onMouseLeave={e => e.target.style.borderColor = "#0d2d48"}>{q}</button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Chat */}
                <div className="card" style={{ display: "flex", flexDirection: "column", gap: 0, padding: 0, overflow: "hidden" }}>
                  <div style={{ padding: "16px 20px", borderBottom: "1px solid #0d2d48", display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#00f0b4", boxShadow: "0 0 8px #00f0b4" }} />
                    <span className="orbitron" style={{ fontSize: 12, letterSpacing: 2, color: "#7eb8d4" }}>AI COACH — ONLINE</span>
                  </div>
                  <div style={{ flex: 1, overflowY: "auto", padding: "20px", display: "flex", flexDirection: "column", gap: 14, minHeight: 0 }}>
                    {aiChat.length === 0 && (
                      <div style={{ textAlign: "center", padding: "40px 20px" }}>
                        <div style={{ fontSize: 40, marginBottom: 16 }}>🤖</div>
                        <div className="orbitron" style={{ fontSize: 14, color: "#7eb8d4", marginBottom: 8 }}>FORMIQ COACH READY</div>
                        <div style={{ fontSize: 12, color: "#4a8aa8", lineHeight: 1.6 }}>Ask me about your form, exercise technique, muscle activation, injury prevention, or workout optimization.</div>
                      </div>
                    )}
                    {aiChat.map((msg, i) => (
                      <div key={i} style={{ display: "flex", justifyContent: msg.role === "user" ? "flex-end" : "flex-start" }}>
                        <div className={`chat-bubble ${msg.role}`}>
                          {msg.role === "assistant" && <div style={{ fontSize: 10, color: "#00f0b4", letterSpacing: 1, marginBottom: 6 }} className="orbitron">AI COACH</div>}
                          <div style={{ fontSize: 13, lineHeight: 1.6, color: "#c8e6f5" }}>{msg.text}</div>
                        </div>
                      </div>
                    ))}
                    {loading && (
                      <div style={{ display: "flex" }}>
                        <div className="chat-bubble assistant">
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            {[0, 1, 2].map(i => <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: "#00f0b4", animation: `skPulse 1s ${i * 0.2}s infinite` }} />)}
                          </div>
                        </div>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>
                  <div style={{ padding: "16px 20px", borderTop: "1px solid #0d2d48", display: "flex", gap: 10 }}>
                    <input className="chat-input" value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendChat()} placeholder="Ask your AI coach..." />
                    <button className="btn-primary" style={{ padding: "10px 20px" }} onClick={sendChat}>SEND</button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Feedback Toast */}
          <div className={`feedback-toast ${feedbackVisible ? "visible" : ""}`}>
            <div style={{ fontSize: 10, color: "#00f0b4", letterSpacing: 1, marginBottom: 6 }} className="orbitron">◉ AI FEEDBACK</div>
            <div style={{ fontSize: 13, color: "#c8e6f5", lineHeight: 1.5 }}>{feedback}</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FitnessTracker />);
  </script>
</body>
</html>
